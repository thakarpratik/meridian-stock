name: Buy alerts

# Desk snapshot only. Every 15 minutes on weekdays, 13:00–21:59 UTC, it saves
# desk.json to the desk-data branch. The Claude-hosted copy of the app reads
# that file, so the early runs before the open give it the levels from the
# last close. Off the :00 and :15 marks, where GitHub delays or drops the most
# scheduled runs.
#
# Phone alerts no longer run here. They run on Vercel every two minutes
# (/api/alert-run, called by cron-job.org) with stop-loss and target alerts.
# NTFY_TOPIC is left unset below so this job does not push duplicates.
on:
  schedule:
    - cron: "4,19,34,49 13-21 * * 1-5"
  workflow_dispatch:

concurrency:
  group: buy-alerts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/buy-alerts.mjs
            scripts/desk-job.ts
            src/lib/desk
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the desk snapshot
        env:
          SNAPSHOT_FILE: out/desk.json
        run: npx -y tsx@4.20.3 scripts/desk-job.ts

      - name: Publish the snapshot to the desk-data branch
        if: always()
        run: |
          [ -f out/desk.json ] || { echo "No snapshot this run."; exit 0; }
          cd out
          git init -q -b desk-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desk.json
          git commit -q -m "Desk snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" desk-data
        env:
          GITHUB_TOKEN: ${{ github.token }}
